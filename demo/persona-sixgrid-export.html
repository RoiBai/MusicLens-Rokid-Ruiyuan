<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MusicLens Six Grid Export</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1800px;
      height: 1200px;
      overflow: hidden;
      background: #050606;
      color: #f4fff6;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .board {
      width: 1800px;
      height: 1200px;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 18px;
      background: radial-gradient(circle at 50% 45%, rgba(82, 255, 139, 0.06), transparent 28%), #050606;
    }

    .cell {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(92, 242, 138, 0.28);
      background: #090b0c;
      min-width: 0;
      min-height: 0;
    }

    .wall {
      background: #000;
    }

    .wall img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.82;
      filter: saturate(0.94) contrast(1.02);
    }

    .info {
      padding: 34px 36px;
      background: linear-gradient(180deg, #050706, #090d0a);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      color: #66f28f;
      font-size: 54px;
      line-height: 1.02;
    }

    .role {
      margin-top: 12px;
      color: rgba(255,255,255,0.68);
      font-size: 18px;
      font-weight: 700;
    }

    .info-block {
      display: grid;
      gap: 14px;
    }

    .label {
      display: inline-flex;
      align-items: center;
      width: max-content;
      padding: 8px 12px;
      border: 1px solid rgba(102, 242, 143, 0.28);
      color: #66f28f;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.36);
    }

    .info p {
      margin: 0;
      color: rgba(255,255,255,0.88);
      font-size: 21px;
      line-height: 1.52;
      font-weight: 650;
    }

    .style-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .style-pills span {
      color: #d8ffe1;
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(255,255,255,0.04);
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .stage-title {
      position: absolute;
      left: 18px;
      top: 16px;
      z-index: 8;
      color: rgba(255,255,255,0.76);
      background: rgba(0,0,0,0.48);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pill {
      position: absolute;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 25px;
      line-height: 1.22;
      font-weight: 900;
      text-shadow: 0 2px 12px rgba(0,0,0,0.82);
    }

    .dismiss {
      color: #ffd9d9;
      background: rgba(180, 28, 36, 0.28);
      border: 1px solid rgba(255, 86, 93, 0.72);
      text-decoration: line-through;
      text-decoration-color: rgba(255, 180, 180, 0.9);
    }

    .accept {
      color: #dfffe6;
      background: rgba(43, 214, 101, 0.27);
      border: 1px solid rgba(102, 242, 143, 0.82);
    }

    .accept-badge,
    .dismiss-badge {
      position: absolute;
      z-index: 11;
      right: 18px;
      top: 16px;
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: 0.12em;
    }

    .accept-badge {
      color: #071309;
      background: #66f28f;
    }

    .dismiss-badge {
      color: #fff2f2;
      background: rgba(210, 42, 52, 0.68);
      border: 1px solid rgba(255, 115, 120, 0.7);
    }

    .d1 { left: 40px; top: 105px; }
    .d2 { right: 34px; top: 242px; }
    .d3 { left: 72px; bottom: 88px; }
    .a1 { left: 50%; top: 46%; transform: translate(-50%, -50%); border-radius: 26px; text-align: center; justify-content: center; }

    .focal-ring {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 120px;
      height: 120px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.22);
      box-shadow: 0 0 0 999px rgba(0,0,0,0);
      z-index: 6;
      pointer-events: none;
    }

    .verse-line {
      position: absolute;
      z-index: 10;
      max-width: 47%;
      padding: 10px 13px;
      background: rgba(0,0,0,0.46);
      border: 1px solid rgba(102, 242, 143, 0.3);
      color: #f4fff6;
      font-size: 22px;
      line-height: 1.32;
      font-weight: 850;
      text-shadow: 0 2px 10px #000;
    }

    .verse-line em {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      border-radius: 50%;
      background: rgba(102, 242, 143, 0.9);
      color: #061307;
      font-size: 14px;
      font-style: normal;
      font-weight: 1000;
    }

    .v1 { left: 24px; top: 92px; }
    .v2 { right: 24px; top: 170px; }
    .v3 { left: 24px; bottom: 148px; }
    .v4 { right: 24px; bottom: 58px; }

    .mic {
      position: absolute;
      z-index: 14;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: rgba(102, 242, 143, 0.22);
      border: 1px solid rgba(102, 242, 143, 0.82);
      display: grid;
      place-items: center;
      box-shadow: 0 0 34px rgba(102, 242, 143, 0.34);
    }

    .mic svg {
      width: 42px;
      height: 42px;
      stroke: #66f28f;
      stroke-width: 2.4;
      fill: none;
    }

    .wave {
      position: absolute;
      z-index: 13;
      left: 50%;
      top: 46%;
      width: 132px;
      height: 132px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(102, 242, 143, 0.35);
      border-radius: 50%;
      animation: pulse 1.9s ease-in-out infinite;
    }

    .wave.two {
      width: 174px;
      height: 174px;
      animation-delay: 0.55s;
      opacity: 0.65;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.28; transform: translate(-50%, -50%) scale(0.92); }
      50% { opacity: 0.88; transform: translate(-50%, -50%) scale(1.05); }
    }

    .summary {
      padding: 28px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
      background: linear-gradient(180deg, rgba(102, 242, 143, 0.08), rgba(255,255,255,0.025));
    }

    .summary h2 {
      margin: 0;
      color: #66f28f;
      font-size: 28px;
      line-height: 1.2;
    }

    .summary .hook {
      border-left: 4px solid #66f28f;
      padding-left: 16px;
      font-size: 30px;
      line-height: 1.34;
      font-weight: 950;
    }

    .summary .steps {
      display: grid;
      gap: 10px;
      align-content: end;
      color: rgba(255,255,255,0.82);
      font-size: 18px;
      line-height: 1.46;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const wall = "./graffiti-wall.png";
    const people = {
      jay: {
        name: "周杰伦",
        role: "家喻户晓歌手 / 华语流行、R&B、嘻哈、古典采样",
        style: ["中文口语", "内韵", "R&B 切分", "少年怀旧"],
        bio: "从街头、篮球场、练琴房和录音棚长出来的人。习惯把宏大的情绪藏进生活物件里，让旋律先走，文字在节拍里拐弯。",
        dismiss: ["街头像梦", "颜色在哭", "青春涂鸦"],
        accept: "你把名字喷歪了，我却跟着唱准了",
        verse1: ["你把名字喷歪了，我却跟着唱准了", "巷口的拍子慢半格，心跳刚好补上了", "墙上那句没人懂的，我用副歌认领了", "喷歪了，唱准了，原来青春没走错"],
        verse2: ["你把名字喷歪了，我偏跟着唱准", "巷口慢半拍，心跳替我押韵", "没人懂那行字，我把它唱成我们", "喷歪了，唱准了，青春没有走偏门"],
        summary: ["把“喷歪”改成犯错的少年感。", "把“唱准”做成音乐替人生校音。", "重复喷歪/唱准，形成副歌口头禅。"]
      },
      billie: {
        name: "Billie Eilish",
        role: "家喻户晓歌手 / Alternative pop、whisper vocal、dark minimal production",
        style: ["whisper", "minimal", "dark intimate", "bedroom pop"],
        bio: "卧室录音、低声、近距离麦克风和不安的身体感构成她的视角。她会把墙看成太近的秘密，一层层被盖住的呼吸。",
        dismiss: ["broken colors", "city screams", "painted sadness"],
        accept: "I hide my name where the wall forgets to breathe",
        verse1: ["I hide my name where the wall forgets to breathe", "Don’t say it back, don’t make it real for me", "Paint over paint, but it still knows underneath", "I hide my name where the wall forgets to breathe"],
        verse2: ["I wrote my name where the wall can’t breathe", "Don’t say it back, it gets too close to me", "Paint over paint, but it stays underneath", "I wrote my name where the wall can’t breathe"],
        summary: ["把 hide 改成 wrote，让动作更可唱。", "保留 wall/breathe 的窒息感。", "重复首尾句，制造 whisper loop。"]
      },
      beyonce: {
        name: "Beyoncé",
        role: "家喻户晓歌手 / Pop、R&B、舞台宣言、合唱感",
        style: ["anthem", "R&B", "crowd chant", "body groove"],
        bio: "舞台、家族、女性力量、南方节奏和集体呼喊是她的坐标。她看见涂鸦墙，会把私人名字变成众人的队形。",
        dismiss: ["I am strong", "paint my crown", "queen wall"],
        accept: "They tried to cover me, I turned the wall into a choir",
        verse1: ["They tried to cover me, I turned the wall into a choir", "Step on the concrete, lift my name a little higher", "If they paint over us, we come back louder", "Cover me, cover me, I turn it into fire"],
        verse2: ["They tried to cover me, I made the wall sing higher", "Feet on the concrete, names rising like a choir", "Paint over us, we come back louder", "Cover me, cover me, I turn it into fire"],
        summary: ["把 wall into a choir 扩成群体合唱。", "加入脚步和 concrete，让身体进入节拍。", "重复 cover me，变成舞台口号。"]
      },
      clockmaker: {
        name: "雾港钟表师",
        role: "虚拟人物 / 港口机械民谣、慢拍、旧金属与潮湿记忆",
        style: ["机械民谣", "低沉", "海雾", "旧钟摆"],
        bio: "住在常年起雾的旧港口，替出海的人修怀表。父亲在台风夜没有回来，所以他把坏齿轮都当成没能准时抵达的人。",
        dismiss: ["墙很旧", "时间破碎", "海风孤独"],
        accept: "墙上的每层漆，都像晚归的人慢了一秒",
        verse1: ["墙上的每层漆，都慢了一秒", "我替晚归的人，把齿轮拧到很小", "名字被新的颜色盖掉", "可潮声还在，慢一秒，慢一秒"],
        verse2: ["墙上一层一层漆，都晚了一秒", "我把坏掉的齿轮，拧回你的船锚", "名字被新颜色盖掉", "潮声还在，慢一秒，慢一秒"],
        summary: ["把层层漆改成年份堆叠。", "把慢一秒做成钟摆式句尾。", "引入船锚，连接港口人物记忆。"]
      },
      radio: {
        name: "沙漠电台少女",
        role: "虚拟人物 / Lo-fi desert pop、无线电噪声、明亮孤勇",
        style: ["lo-fi", "desert pop", "radio noise", "bright lonely"],
        bio: "在移动沙丘边长大，守着一台能收到陌生人留言的旧电台。她没有固定故乡，靠频率认路。",
        dismiss: ["彩色远方", "孤独信号", "风吹过墙"],
        accept: "他们把我盖掉，我就换个频率发光",
        verse1: ["他们把我盖掉，我就换个频率发光", "沙丘听见城市，把坐标寄到墙上", "滋啦一声，我还在中央", "换个频率，换个频率发光"],
        verse2: ["他们把我盖掉，我换个频率发光", "沙丘替我收听，城市贴在墙上", "滋啦一声，我还在播放", "换个频率，换个频率发光"],
        summary: ["把发光和播放合并成电台动作。", "重复换个频率，做明亮上扬 hook。", "保留被盖掉，但回答是继续发送。"]
      },
      opera: {
        name: "赛博戏班遗孤",
        role: "虚拟人物 / 电子戏曲、破损霓虹、身份伪装与变声器",
        style: ["电子戏曲", "断裂口语", "变声器", "脸谱"],
        bio: "出生在未来城市最后一个流动戏班。戏班被商业系统收购后解散，他带着祖母留下的脸谱和变声器在地下表演。",
        dismiss: ["霓虹破碎", "代码孤儿", "面具哭了"],
        accept: "你们改我的脸，我偏把声音留在墙缝里",
        verse1: ["你们改我的脸，我偏留下我的声", "后台灯一灭，墙缝替我开嗓门", "脸谱被刷成新的编号", "可我一拖腔，旧戏班就回魂"],
        verse2: ["你们改我的脸，我偏留下我的声", "后台灯一灭，墙缝替我开嗓门", "脸谱被刷成新的编号", "我一拖腔，旧戏班就回魂"],
        summary: ["把“墙缝里”收成舞台暗门。", "改我的脸/留下我的声形成对句。", "拖腔让人物不是普通赛博口号。"]
      }
    };

    const id = new URLSearchParams(location.search).get("id") || "jay";
    const p = people[id] || people.jay;

    function micSvg() {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="M8 22h8"/></svg>`;
    }

    function wallCell(kind, inner) {
      return `<section class="cell wall"><img src="${wall}" alt="graffiti wall">${inner}</section>`;
    }

    function verseLines(lines) {
      return lines.map((line, i) => `<div class="verse-line v${i + 1}"><em>${i + 1}</em>${line}</div>`).join("");
    }

    document.getElementById("root").innerHTML = `
      <main class="board">
        <section class="cell info">
          <div>
            <h1>${p.name}</h1>
            <div class="role">${p.role}</div>
          </div>
          <div class="info-block">
            <span class="label">作者信息 + 喜欢风格 + 简介</span>
            <p>${p.bio}</p>
            <div class="style-pills">${p.style.map(s => `<span>${s}</span>`).join("")}</div>
          </div>
        </section>

        ${wallCell("dismiss", `
          <div class="stage-title">Dismiss sentences</div>
          <div class="dismiss-badge">DISMISS</div>
          <div class="pill dismiss d1">${p.dismiss[0]}</div>
          <div class="pill dismiss d2">${p.dismiss[1]}</div>
          <div class="pill dismiss d3">${p.dismiss[2]}</div>
        `)}

        ${wallCell("accept", `
          <div class="stage-title">Accept sentence</div>
          <div class="accept-badge">ACCEPT</div>
          <div class="focal-ring"></div>
          <div class="pill accept a1">${p.accept}</div>
        `)}

        ${wallCell("verse1", `
          <div class="stage-title">Verse v1: avoid focal path</div>
          <div class="focal-ring"></div>
          ${verseLines(p.verse1)}
        `)}

        ${wallCell("verse2", `
          <div class="stage-title">User-modified verse + speaking</div>
          <div class="wave"></div>
          <div class="wave two"></div>
          <div class="mic">${micSvg()}</div>
          ${verseLines(p.verse2)}
        `)}

        <section class="cell summary">
          <span class="label">Final hook logic</span>
          <h2>从 accept 句到主题歌重复段</h2>
          <div class="hook">${p.verse2[0]}</div>
          <div class="steps">${p.summary.map((s, i) => `<div>${i + 1}. ${s}</div>`).join("")}</div>
        </section>
      </main>
    `;
  </script>
</body>
</html>
